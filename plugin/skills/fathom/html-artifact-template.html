<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>{Artifact title}</title>
<!--
  STYLESHEET-ONLY TEMPLATE for HTML artifacts.

  These artifacts render INSIDE the fathom viewer, usually embedded in a
  document, so they should match the viewer's visual language - not the visual
  language of whatever codebase the artifact is about.

  How to use:
  - Keep this <style> block as-is so typography, borders, and badges stay consistent.
  - Put your content inside <body>. There is no required structure - use plain
    prose (<h1>-<h4>, <p>, <ul>), <pre>/<code> for code, and the small set of
    utility classes below (.card, .badge*, .stat*, .ba) when they help.
  - The palette follows the device's light or dark appearance. Use the color
    variables below for anything you draw (SVG fills, chart colors), so the
    artifact works in both. Don't introduce other fonts or off-palette colors.
  - No external requests: system fonts only, scripts and styles inline.
-->
<style>
  :root {
    --bg: #ffffff; --bg-deep: #f6f7f9; --bg-alt: #eceef2;
    --border: #dfe2e7; --guide: #dfe2e7;
    --text: #1c2128; --bright: #0d1117;
    --muted: #5d6673;
    --accent: #2f5fd0; --accent-dim: rgba(47, 95, 208, 0.3);
    --mint: #23803d; --yellow: #a66300; --blue: #0b7c8f;
    --rose: #c5352f; --pink: #a626a4;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --bg-deep: #1c2027; --bg-alt: #252a33;
      --border: #2b313b; --guide: #2b313b;
      --text: #dde2e9; --bright: #ffffff;
      --muted: #97a1af;
      --accent: #8fb0ff; --accent-dim: rgba(143, 176, 255, 0.3);
      --mint: #93d6a0; --yellow: #e6b566; --blue: #6fd0dc;
      --rose: #f08f8f; --pink: #d49bf0;
    }
  }

  * { box-sizing: border-box; }
  ::selection { background: var(--accent-dim); }

  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    margin: 0; padding: 20px 20px 48px; font-size: 15px;
    line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  main, .wrap { max-width: 1120px; margin: 0 auto; }

  /* headings */
  h1, h2, h3, h4 { color: var(--bright); font-weight: 600; line-height: 1.3; margin: 1.6em 0 0.5em; }
  h1 { font-size: 24px; letter-spacing: -0.02em; margin-top: 0; }
  h2 { font-size: 19px; letter-spacing: -0.01em; }
  h3 { font-size: 16px; }
  h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }

  /* prose */
  p { margin: 0 0 1em; max-width: 84ch; }
  strong, b { color: var(--bright); font-weight: 600; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  ul, ol { margin: 0.5em 0 1em; padding-left: 1.6em; max-width: 84ch; }
  li + li { margin-top: 0.35em; }
  li::marker { color: var(--muted); }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  /* code + preformatted */
  code { font-family: var(--mono); font-size: 0.875em; background: var(--bg-alt); padding: 0.1em 0.35em; border-radius: 5px; }
  pre {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--bg-deep);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; color: var(--text);
    margin: 0.8em 0; white-space: pre; tab-size: 2;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  /* optional manual syntax spans inside <pre> */
  pre .k { color: var(--pink); } pre .s { color: var(--mint); }
  pre .c { color: var(--muted); font-style: italic; } pre .fn { color: var(--accent); }

  blockquote { margin: 1em 0; padding: 2px 0 2px 16px; border-left: 3px solid var(--border); color: var(--muted); }

  /* tables */
  table { border-collapse: collapse; margin: 1em 0; font-size: 13.5px; width: 100%; }
  th, td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; vertical-align: top; }
  th { background: var(--bg-deep); font-size: 12.5px; font-weight: 600; }

  /* card - a bordered container for a self-contained block */
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-deep); padding: 18px 22px; margin: 1em 0; }

  /* badges - 1px border + tinted fill; solid fill marks terminal states */
  .badge { display: inline-block; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 7px; text-transform: uppercase; border: 1px solid; border-radius: 999px; }
  .b-accent   { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .b-new      { color: var(--mint);   border-color: color-mix(in srgb, var(--mint) 40%, transparent);   background: color-mix(in srgb, var(--mint) 10%, transparent); }
  .b-modified { color: var(--blue);   border-color: color-mix(in srgb, var(--blue) 40%, transparent);   background: color-mix(in srgb, var(--blue) 10%, transparent); }
  .b-note     { color: var(--rose);   border-color: color-mix(in srgb, var(--rose) 40%, transparent);   background: color-mix(in srgb, var(--rose) 10%, transparent); }
  .b-principle{ color: var(--pink);   border-color: color-mix(in srgb, var(--pink) 40%, transparent);   background: color-mix(in srgb, var(--pink) 10%, transparent); }
  .b-kept     { color: var(--muted);  border-color: var(--border);          background: var(--bg-deep); }
  .b-removed  { color: var(--bg);     border-color: var(--rose);            background: var(--rose); }

  /* stats - key/value chips */
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  .stat { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.6; }
  .stat b { display: block; font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--accent); text-transform: none; letter-spacing: 0; margin-bottom: 2px; }
  .stat b.ok { color: var(--mint); }

  /* before / after - side-by-side code comparison */
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0.8em 0; }
  @media (max-width: 900px) { .ba { grid-template-columns: 1fr; } }
  .ba > div { min-width: 0; }
  .ba .label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 4px; text-transform: uppercase; }
  .ba .before .label { color: var(--rose); }
  .ba .after .label { color: var(--mint); }
  .ba .before pre { border-color: color-mix(in srgb, var(--rose) 40%, transparent); }
  .ba .after pre { border-color: color-mix(in srgb, var(--mint) 40%, transparent); }
  .ba pre { margin: 0; }
</style>
</head>
<body>

<!-- Replace this with the artifact content. Plain prose + the utility classes above. -->

</body>
</html>
