# Built-in workflows, steps and profiles.
#
# Override any of it in ~/.config/keylight/workflows.yaml: the same shape, merged
# over this file one workflow, one step field and one profile entry at a time.

default: design      # workflow for `keylight start` when none is named
profile: default

# A workflow is an ordered list of steps. Each step runs in a fresh session.
workflows:
  direct: [grill, worktree, implement-decisions, review, pr]
  design: [research-questions, research, tdd, structure-outline, worktree, implement-outline, pr]
  product: [research-questions, research, prd, tdd, structure-outline, worktree, implement-outline, pr]

# Step fields:
#   title     how a question to you names the step; without one, the step's name
#   skill     the skill the session opens with; keylight's own are kl:<name>
#   run       a step done by code instead of a session (only `worktree`)
#   session   headless: runs unattended to the end, then the next step starts
#             interactive: you work in it; quitting it hands back to the runner
#   in        checkout (default) or worktree: where the session runs
#   produces  document kind the step must leave in the task folder
#   phases    document kind whose phases must all be marked done
#   check     shell command that must succeed (KEYLIGHT_TASK, KEYLIGHT_TASK_DIR,
#             KEYLIGHT_WORKTREE and KEYLIGHT_BASE are set)
#   prompt    text added to the opening message; {{ task }}, {{ dir }},
#             {{ store }}, {{ worktree }}, {{ base }} and {{ skills }} are filled in
#   confirm   false: when an interactive session ends, count the step as
#             finished and continue without asking
steps:
  research-questions:
    title: the research questions
    skill: kl:create-research-questions
    session: headless
    produces: research-questions
  research:
    title: the research
    skill: kl:create-research
    session: headless
    produces: research
  prd:
    title: the product requirements
    skill: kl:create-prd
    session: interactive
    produces: prd
  tdd:
    title: the technical design
    skill: kl:create-tdd
    session: interactive
    produces: tdd
  structure-outline:
    title: the structure outline
    skill: kl:create-structure-outline
    session: interactive
    produces: structure-outline
  grill:
    title: the grilling
    skill: grilling
    session: interactive
    produces: decisions
    prompt: |
      Grill me about the task described in {{ dir }}/task.md.

      This session runs in a terminal, which draws text only: when a question needs a Mermaid diagram or an HTML page, show it as {{ skills }}/keylight/SCRATCH.md describes.

      When we have reached a shared understanding, write the decisions document to the path that `keylight task next decisions <description>` prints, following the template at {{ skills }}/implement-decisions/decisions-template.md. Then tell me it is written: quitting this session starts the implementation.
  worktree:
    title: the worktree
    run: worktree
  implement-outline:
    title: the implementation
    skill: kl:implement-outline
    session: interactive
    in: worktree
  implement-decisions:
    title: the implementation
    skill: kl:implement-decisions
    session: headless
    in: worktree
    phases: decisions
  review:
    title: the review
    skill: kl:review-loop
    session: headless
    in: worktree
    prompt: |
      Review the implementation of task {{ task }}.

      - Worktree: {{ worktree }}
      - Fixed point: {{ base }}
      - Spec: the decisions document and task.md in {{ store }}
      - Standards: CODING_STANDARDS.md at the repository root, when it exists
      - Artifact directory: {{ store }}
      - Boundary: implementation
    check: >-
      jq -e '.verdict == "clean"'
      "$(ls -d "$KEYLIGHT_TASK_DIR"/review-loop/implementation/round-* | sort | tail -1)/findings.json"
  pr:
    title: the pull request
    skill: kl:describe-pr
    session: headless
    in: worktree
    produces: pr-description

# A profile says how each step's session is launched. Entries combine field by
# field, the most specific winning:
#   <step>          that step
#   claude, codex   every session in that harness
#   "*"             every step
#   harness      claude (default) or codex; set it in "*" or on a step
#   model        passed to the harness; omitted, the harness uses its own default
#   effort       reasoning effort; omitted, the harness default
#   permissions  claude: permission mode (headless default: auto)
#                codex: sandbox mode (default: workspace-write)
#   args         extra arguments passed to the harness as they are
#   subagents    { model, effort } for the sub-agents the session dispatches
#                (claude only; overrides any model the session would pick)
profiles:
  default:
    "*": { harness: claude }
