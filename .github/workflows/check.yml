# Each job runs one package.json script, so a failure reproduces locally with
# the same command. The weekly run is for the harness job: Claude Code and Codex
# can drop a flag without any change here.

name: check

on:
  pull_request:
    # edited includes a change of base branch, which moves the range and the test merge. It also fires for a
    # new title or description, which the changes job answers without running the checks again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # A skipped job counts as passed. So after a change of title or description the five checks are skipped only
  # when each of them last passed on this commit; otherwise they run, as they do for every other event.
  changes:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$DESCRIPTION_ONLY" = true ]; then
            # Each check's latest result on this commit, leaving out this run and results that were themselves skips.
            passed=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs?per_page=100" |
              jq -r --arg run "/runs/$GITHUB_RUN_ID/" '
                [.[].check_runs[]
                  | select(.app.slug == "github-actions" and .conclusion != "skipped")
                  | select(.details_url | contains($run) | not)]
                | group_by(.name) | map(max_by(.id) | select(.conclusion == "success") | .name) | join(" ")')
            echo "passed on $HEAD: $passed"
            for job in audit browser check commits harness; do
              case " $passed " in *" $job "*) ;; *) job= && break ;; esac
            done
            [ -n "$job" ] && run=false
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  check:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bun run check

  browser:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: bunx playwright install webkit
      - run: bun run check:browser

  audit:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:audit

  commits:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      # The pull request's own head, not GitHub's test merge, so the range holds the branch's commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # A force push to main leaves the old tip on no branch, so the checkout above lacks it.
      - run: git cat-file -e "$BASE^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:commits "$BASE"

  harness:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun ci
      - run: npm install --global @anthropic-ai/claude-code@latest @openai/codex@latest
      - run: bun run check:harness
